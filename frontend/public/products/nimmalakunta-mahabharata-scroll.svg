<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#gridPattern)"/>

  <!-- Decorative Ambient Circles -->
  <circle cx="150" cy="150" r="220" fill="#FDE047" opacity="0.08" filter="blur(40px)"/>
  <circle cx="650" cy="450" r="180" fill="#A855F7" opacity="0.08" filter="blur(40px)"/>

  <!-- Central Product Showcase Shield -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="50" width="640" height="500" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  </g>

  <!-- Corner Ornamental Accents -->
  <path d="M 100 80 L 140 80 M 100 80 L 100 120" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 700 80 L 660 80 M 700 80 L 700 120" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 100 520 L 140 520 M 100 520 L 100 480" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 700 520 L 660 520 M 700 520 L 700 480" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- GI Tag Badge Pill -->
  <g transform="translate(110, 80)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6" fill="#10B981"/>
    <text x="32" y="21" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GI CERTIFIED AUTHENTIC</text>
  </g>

  <!-- State Origin Pill -->
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="80" y="21" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">ANDHRA PRADESH</text>
  </g>

  <!-- Central Craft Icon & Emblem -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="90" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-dasharray="6,6" stroke-width="2"/>
    
    <!-- Central Vector Artwork Icon -->
    <g transform="translate(-32, -32) scale(2.6)">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Product Name & Typography -->
  <text x="400" y="380" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Nimmalakunta Leather Hand-Painted Ma
  </text>
  <text x="400" y="410" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    Parchment Leather Translucent Art
  </text>

  <!-- Bottom Details Bar -->
  <line x1="130" y1="445" x2="670" y2="445" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <g transform="translate(130, 465)">
    <text x="0" y="16" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CRAFT CLUSTER</text>
    <text x="0" y="38" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Tholu Bommalata Cluster</text>
  </g>

  <g transform="translate(400, 465)">
    <text x="0" y="16" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">EXPORT MOQ</text>
    <text x="0" y="38" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4 Piece</text>
  </g>

  <g transform="translate(670, 465)">
    <text x="0" y="16" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">WHOLESALE PRICE</text>
    <text x="0" y="38" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="end">$95.00</text>
  </g>
</svg>